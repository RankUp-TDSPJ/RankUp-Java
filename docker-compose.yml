services:
  rankup-api:
    build: .
    container_name: rankup-api
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl"
      SPRING_DATASOURCE_USERNAME: "${ORACLE_USER}"
      SPRING_DATASOURCE_PASSWORD: "${ORACLE_PASSWORD}"
    restart: unless-stopped